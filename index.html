<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>IKI1UC · Axiom‑Orbit‑System</title>

<style>
    body { background:#0b0b0b; color:#e0e0e0; font-family:Consolas; }
    h1 { color:#6cf; }
    #orbitCanvas { background:#000; border:1px solid #333; }
    #log { background:#111; padding:10px; height:140px; overflow:auto; }
    .btn { padding:8px 14px; background:#222; color:#fff; border:1px solid #555; cursor:pointer; }
</style>

<!-- SYSTEM CORE -->
<script src="core.js"></script>
<script src="SYS.js"></script>

<!-- AXIOM + ORBIT -->
<script src="axiom.js"></script>
<script src="atom.js"></script>
<script src="molecule.js"></script>

<!-- RAWATOR ENGINE -->
<script src="rawator.js"></script>
<script src="rawator-81.js"></script>
<script src="rawator-life.js"></script>
<script src="RAWATOR.geo.json"></script>
<script src="RAWATOR.id.json"></script>

<!-- RESPO + ROOMS -->
<script src="RESPO.room.js"></script>
<script src="NC.room.js"></script>
<script src="HOLO.room.js"></script>

<!-- HOLO ENGINE -->
<script src="HOLO.engine.js"></script>

<!-- BEAM -->
<script src="beam.js"></script>
<script src="beam.json"></script>

<!-- USER + USE -->
<script src="user.json"></script>
<script src="use.json"></script>

</head>
<body>

<h1>IKI1UC · Axiom‑Orbit‑Matrix</h1>

<canvas id="orbitCanvas" width="600" height="300"></canvas>

<br>

<button class="btn" onclick="stepOrbit()">Orbit‑Schritt</button>
<button class="btn" onclick="resetOrbit()">Reset</button>

<h3>IQQ‑Achse</h3>
<p>9 → 3 → 9 → 3</p>

<h3>OCTA‑Orbit</h3>
<p>◎ ◉ ◆ △ ▣ ↺</p>

<h3>A81‑Potenzen</h3>
<p>27 · 81 · 243 · 729</p>

<h3>Log</h3>
<div id="log">System geladen.</div>

<script>
const orbit = ["◉","↗","↘","3","9","↘","↗","◎","↗","↘","3","9","↘","↗","◎","↗","↘","81","◆","↘","↗","△","↗","↘","27","▣","↘","↗","3","↺"];
let index = 0;

function drawOrbit() {
    const c = document.getElementById("orbitCanvas");
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.fillStyle = "#6cf";
    ctx.font = "40px Consolas";
    ctx.fillText(orbit[index], 280, 150);
}

function stepOrbit() {
    index++;
    if(index >= orbit.length) {
        // ⭐ ABSICHTLICHER FEHLER (wie du willst)
        log("Orbit‑Fehler: Index außerhalb der Matrix → Axiom‑Sprung aktiviert.");
    } else {
        log("Orbit‑Schritt: " + orbit[index]);
    }
    drawOrbit();
}

function resetOrbit() {
    index = 0;
    log("Orbit zurückgesetzt.");
    drawOrbit();
}

function log(msg) {
    const logBox = document.getElementById("log");
    logBox.innerHTML += "<br>" + msg;
}

drawOrbit();
</script>

</body>
</html>
